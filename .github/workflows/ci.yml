name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev --python 3.11

      - name: Run isolated backend regression
        working-directory: backend
        run: uv run --locked --python 3.11 python ../scripts/test-isolated.py --output "${RUNNER_TEMP}/eic-isolated-tests" --timeout 600

      - name: Validate deployment files
        working-directory: backend
        run: uv run --locked --python 3.11 python ../scripts/validate_deploy.py

      - name: Validate source package policy and scan high-confidence secrets
        working-directory: backend
        run: uv run --locked --python 3.11 python ../scripts/package-cloud.py --output "${RUNNER_TEMP}/eic-source-check.tar.gz"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend source and types
        working-directory: frontend
        run: npm run check

      - name: Build and audit frontend bundle
        working-directory: frontend
        run: npm run build
