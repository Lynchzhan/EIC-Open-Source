[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enterprise-intelligence-center"
version = "0.1.0"
description = "Enterprise Intelligence Center backend"
requires-python = ">=3.11"
dependencies = [
  "aiomysql>=0.2.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "arq>=0.26.0",
  "asyncpg>=0.30.0",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "mcp==1.30.0",
  "langchain-core>=1.0.0,<2.0.0",
  "langchain-text-splitters==1.0.0",
  "langchain-openai>=1.6.0,<2.0.0",
  "langchain-ollama==1.0.1",
  "ollama==0.6.0",
  "openai>=2.2.0,<4.0.0",
  "langgraph>=1.0.0,<2.0.0",
  "pgvector>=0.3.6",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "xlrd>=2.0.1",
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
  "rapidocr_onnxruntime>=1.2.3,<1.3.0",
  "jieba>=0.42.1",
  "jsonschema>=4.23.0,<5.0.0",
  "rank-bm25>=0.2.2",
  "PyJWT>=2.10.0",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2.7.0",
  "qdrant-client>=1.12.0",
  "PyYAML>=6.0.2",
  "redis>=5.2.0",
  "SQLAlchemy[asyncio]>=2.0.36,<3.0.0",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/eic"]

[tool.hatch.build.targets.wheel.force-include]
"skills/text-statistics/SKILL.md" = "eic/skills/text-statistics/SKILL.md"
"skills/json-format/SKILL.md" = "eic/skills/json-format/SKILL.md"
"skills/csv-summary/SKILL.md" = "eic/skills/csv-summary/SKILL.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI deliberately declares dependencies and multipart fields as parameter defaults.
ignore = ["B008"]
