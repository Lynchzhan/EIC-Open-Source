server {
  listen 80;
  server_name _;
  client_max_body_size 50m;
  location = /health {
    proxy_pass http://backend:8000/health;
    proxy_set_header Host $host;
  }
  location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
  location /api/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 360s; proxy_set_header Host $host; }
}
