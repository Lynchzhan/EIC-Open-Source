services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: eic
      MYSQL_USER: eic
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: eic_vector
      POSTGRES_USER: eic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eic -d eic_vector"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  migrate:
    image: ${EIC_BACKEND_IMAGE:?set EIC_BACKEND_IMAGE from verified release manifest}
    build: ../backend
    restart: "no"
    env_file: .env
    environment:
      EIC_DATABASE_URL: mysql+aiomysql://eic:${MYSQL_PASSWORD}@mysql:3306/eic
    command: ["python", "-m", "eic.core.schema", "upgrade"]
    depends_on:
      mysql:
        condition: service_healthy
  backend:
    image: ${EIC_BACKEND_IMAGE:?set EIC_BACKEND_IMAGE from verified release manifest}
    build: ../backend
    restart: unless-stopped
    env_file: .env
    volumes: [uploads_data:/app/uploads, experience_control:/app/experience-control]
    tmpfs:
      - /run/eic-experience:size=32m,mode=0700
    environment:
      EIC_EXPERIENCE_ROOT: /app/experience-control
      EIC_EXPERIENCE_CONTENT_ROOT: /run/eic-experience
      EIC_DATABASE_URL: mysql+aiomysql://eic:${MYSQL_PASSWORD}@mysql:3306/eic
      EIC_VECTOR_DATABASE_URL: postgresql+asyncpg://eic:${POSTGRES_PASSWORD}@postgres:5432/eic_vector
      EIC_REDIS_URL: redis://redis:6379/0
      EIC_AUTO_CREATE_SCHEMA: "false"
      EIC_RUNTIME_SCHEMA_UPDATES: "false"
      EIC_BOOTSTRAP_ENABLED: "false"
      EIC_SEED_DEMO_DATA: "false"
    command: ["uvicorn", "eic.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    image: ${EIC_BACKEND_IMAGE:?set EIC_BACKEND_IMAGE from verified release manifest}
    build: ../backend
    restart: unless-stopped
    env_file: .env
    volumes: [uploads_data:/app/uploads]
    environment:
      EIC_DATABASE_URL: mysql+aiomysql://eic:${MYSQL_PASSWORD}@mysql:3306/eic
      EIC_VECTOR_DATABASE_URL: postgresql+asyncpg://eic:${POSTGRES_PASSWORD}@postgres:5432/eic_vector
      EIC_REDIS_URL: redis://redis:6379/0
      EIC_AUTO_CREATE_SCHEMA: "false"
      EIC_RUNTIME_SCHEMA_UPDATES: "false"
      EIC_BOOTSTRAP_ENABLED: "false"
      EIC_SEED_DEMO_DATA: "false"
    command: ["arq", "eic.workers.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
      redis:
        condition: service_healthy
  frontend:
    image: ${EIC_FRONTEND_IMAGE:?set EIC_FRONTEND_IMAGE from verified release manifest}
    build: ../frontend
    restart: unless-stopped
    expose: ["80"]
    depends_on: [backend]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
volumes:
  mysql_data:
  postgres_data:
  redis_data:
  uploads_data:
  experience_control:
